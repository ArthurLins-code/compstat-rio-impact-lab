# Servidor nginx do frontend CompStat Rio (container de produção).
# Serve o build do Vite (SPA fallback para /index.html) e faz proxy
# de /api -> backend:8010, espelhando o que o dev server do Vite faz.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API. Mantém SSE do copiloto (sem buffering).
    location /api/ {
        proxy_pass         http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming: desabilita buffer e timeout estendido.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache leve dos assets versionados pelo Vite (hash no nome).
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
